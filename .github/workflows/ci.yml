name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run test
        env:
          Test_API_KEY: ${{ secrets.TEST_API_KEY }}
        run: npm test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.html
